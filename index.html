<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>City — Downtown Driving</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <!-- Heads-Up Display -->
  <div id="perf-hud">
    <div class="perf-row">
      <span class="perf-label">FPS</span>
      <span id="fps-value">—</span>
    </div>
    <div class="perf-row">
      <span class="perf-label">Carga</span>
      <span id="load-value">50</span>
      <span class="perf-unit">/100</span>
    </div>
    <div id="load-bar"><div id="load-fill"></div></div>
    <div id="load-detail">batch —</div>
    <div id="load-phase">boot</div>
    <div id="hitch-panel" data-min-id="hitch-load">
      <button type="button" class="hud-min-toggle" id="hitch-label" data-min-toggle>
        Travamentos — carga <span data-min-chev>▾</span>
      </button>
      <ol id="hitch-list" class="hitch-list" data-min-body></ol>
    </div>
  </div>

  <div id="play-hitch-hud" data-min-id="hitch-fps">
    <button type="button" class="hud-min-toggle" id="play-hitch-label" data-min-toggle>
      Travamentos — FPS <span data-min-chev>▾</span>
    </button>
    <ol id="play-hitch-list" class="hitch-list" data-min-body></ol>
  </div>

  <div id="load-order-hud" data-min-id="load-order">
    <button type="button" class="hud-min-toggle" id="load-order-label" data-min-toggle>
      Ordem de carga <span data-min-chev>▾</span>
    </button>
    <ul id="load-order-list" data-min-body></ul>
  </div>

  <div id="ring-load-hud" data-min-id="ring-load">
    <button type="button" class="hud-min-toggle" id="ring-load-label" data-min-toggle>
      Anel (últimos) <span data-min-chev>▾</span>
    </button>
    <div data-min-body>
      <ul id="ring-load-list"></ul>
      <div id="ring-load-footer">—</div>
    </div>
  </div>

  <div id="hud">
    <div id="speedometer">
      <span id="speed-value">0</span>
      <span id="speed-unit">km/h</span>
    </div>
    <div id="controls-hint">
      <kbd>W</kbd> Accelerate
      <kbd>S</kbd> Reverse
      <kbd>A</kbd><kbd>D</kbd> Steer
      <kbd>Space</kbd> Brake
      <kbd>R</kbd> Reset
      <kbd>C</kbd> Câmera · voo: WASD + mouse
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
